<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Budget Tracker</title>
    <!-- Top color of the background gradient; useSettings keeps it in sync with the chosen theme -->
    <meta name="theme-color" content="#d4f5e6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 'black-translucent' lets the page (and its gradient) draw behind the status bar / Dynamic Island;
         global.css adds a soft top scrim so iOS's white status text stays legible on the light theme -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Apply saved theme before first paint (key/shape owned by src/hooks/useSettings.js) -->
    <script>
      try {
        var t = (JSON.parse(localStorage.getItem('budgetapp_settings')) || {}).theme
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-title" content="Budget" />
    <!-- Home-screen icon (iOS ignores the manifest icons). Source art: Icon.png; corners filled with green,
         since iOS applies its own rounded mask and renders transparency/black corners as-is -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
